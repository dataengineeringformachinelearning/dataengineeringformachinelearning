# Control-plane CI — lint/security + backend/frontend tests.
# Data-plane workloads are covered by FORJD CI.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deml-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: astral-sh/setup-uv@v6

      - name: Install workspace dependencies
        run: npm ci --legacy-peer-deps

      # Fail fast on formatting/theme/lint before security tooling.
      - name: Pre-commit (fast)
        run: uvx pre-commit run --all-files --hook-stage pre-commit

      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.68.2
          cache: true

      - name: Install backend deps
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt

      - name: Pre-push (security)
        run: uvx pre-commit run --all-files --hook-stage pre-push

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pytest
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: pytest --tb=short -q

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci --legacy-peer-deps --prefix ..

      - name: Lint
        run: npm run lint

      - name: Vitest (app)
        run: npm test

      - name: Vitest (viking-ui library)
        run: npm run test:viking-ui

  viking-ui-version:
    name: Viking-UI version contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify manifests and lockfiles
        run: npm run check:viking-ui:version
