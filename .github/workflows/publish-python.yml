# Publish deml-crypto / deml-rate-limit to PyPI (skip-existing keeps pushes idempotent).

name: Publish Python packages

on:
  push:
    branches: [main]
    paths:
      - "packages/deml-crypto/**"
      - "packages/deml-rate-limit/**"
      - ".github/workflows/publish-python.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-python
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: deml-crypto
            environment: pypi-crypto
          - package: deml-rate-limit
            environment: pypi-rate-limit
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build and check
        run: |
          pip install build twine
          cd "packages/${{ matrix.package }}"
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: "packages/${{ matrix.package }}/dist"
          skip-existing: true
