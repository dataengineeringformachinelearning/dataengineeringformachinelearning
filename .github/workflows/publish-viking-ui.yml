# Publish @dataengineeringformachinelearning/viking-ui to npm + Chromatic visual record.

name: Publish Viking-UI

on:
  push:
    branches: [main]
    paths:
      - "packages/viking-ui/**"
      - ".changeset/**"
      - "package-lock.json"
      - "package.json"
      - ".github/workflows/publish-viking-ui.yml"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Force a publish attempt (fails when version already exists)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-viking-ui
  cancel-in-progress: false

jobs:
  release:
    name: npm publish and Chromatic
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/viking-ui/package-lock.json
          registry-url: "https://registry.npmjs.org"

      - name: Version contract
        run: npm run check:viking-ui:version

      - name: Install workspace
        run: npm ci --legacy-peer-deps

      # Fail fast before npm publish / Storybook.
      - name: Theme enforcement
        run: node scripts/enforce-theme.js

      - name: Audit and package tests
        run: |
          npm audit --audit-level=high
          npm run test:viking-ui:package

      - name: Verify npm token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NPM_TOKEN" || { echo "::error::NPM_TOKEN is not configured" >&2; exit 1; }
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm whoami

      # publish:viking-ui runs ci:viking-ui (rebuild + test + docs) before npm publish.
      - name: Changesets publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version:viking-ui
          publish: npm run publish:viking-ui
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Resolve publish state
        id: ensure-release
        run: |
          LOCAL_VERSION="$(node -p "require('./packages/viking-ui/package.json').version")"
          if [ "${{ steps.changesets.outputs.published }}" = "true" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.inputs.force_publish }}" = "true" ]; then
            if npm view "@dataengineeringformachinelearning/viking-ui@${LOCAL_VERSION}" version >/dev/null 2>&1; then
              echo "::error::force_publish enabled but v${LOCAL_VERSION} already exists on npm" >&2
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            (cd packages/viking-ui && npm publish --access public --tag latest)
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if npm view "@dataengineeringformachinelearning/viking-ui@${LOCAL_VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::No changesets published. Add a changeset or re-run with force_publish=true." >&2
          echo "published=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Install Storybook toolchain
        if: steps.ensure-release.outputs.published == 'true'
        run: npm ci --legacy-peer-deps --prefix packages/viking-ui

      - name: Chromatic
        if: steps.ensure-release.outputs.published == 'true'
        run: |
          test -n "$CHROMATIC_PROJECT_TOKEN"
          npm run build-storybook --prefix packages/viking-ui
          npx chromatic \
            --project-token "$CHROMATIC_PROJECT_TOKEN" \
            --storybook-build-dir packages/viking-ui/storybook-static \
            --exit-zero-on-changes

      - name: Sync design system
        if: steps.ensure-release.outputs.published == 'true'
        run: npm run sync:design-system
