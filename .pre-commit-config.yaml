# Community / marketing repo — lightweight hooks only.
# Control-plane quality gates live in https://github.com/dataengineeringformachinelearning/deml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
