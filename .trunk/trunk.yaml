# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.10.2
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.12.8
lint:
  enabled:
    - bandit@1.9.4
    - checkov@3.3.8
    - git-diff-check
    - grype@0.116.0
    - hadolint@2.14.0
    - markdownlint@0.49.1
    - osv-scanner@2.4.0
    - oxipng@10.1.1
    - prettier@3.9.6
    - ruff@0.16.0
    - shellcheck@0.11.0
    - shfmt@3.6.0
    - taplo@0.10.0
    - trufflehog@3.95.9
    - yamllint@1.38.0
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
