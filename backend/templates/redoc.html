{% load static %}
<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ api_title }} — ReDoc</title>
    <meta
      name="description"
      content="ReDoc reference for the DEML learning platform API."
    />
    <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="stylesheet" href="{% static 'viking-ui.css' %}" />
    <link rel="stylesheet" href="{% static 'suite-apidocs.css' %}" />
  </head>
  <body class="suite-backend-docs backend-redoc">
    <header class="suite-backend-topbar backend-docs-topbar fj-topbar">
      <a class="suite-backend-brand backend-docs-brand fj-brand" href="{{ frontend_url }}/">DEML</a>
      <nav aria-label="API documentation">
        <a href="{{ frontend_url }}/">product</a>
        <a href="/api/v1/docs">swagger</a>
        <a href="/api/v1/openapi.json">openapi</a>
        <a href="/api/v1/health">health</a>
        <a href="/api/v1/ready">ready</a>
      </nav>
    </header>
    <redoc spec-url="{{ openapi_url }}"></redoc>
    <script src="{% static 'vendor/redoc/redoc.standalone.js' %}"></script>
  </body>
</html>
