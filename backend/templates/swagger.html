{% load static %}
<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ api_title }} — API docs</title>
    <meta
      name="description"
      content="Interactive Swagger documentation for the DEML learning platform API."
    />
    <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml" />
    <meta name="theme-color" content="#111111" />
    <!-- nosemgrep: html.security.audit.missing-integrity.missing-integrity — Swagger UI CDN; major version pinned -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css"
    />
    <link rel="stylesheet" href="{% static 'viking-ui.css' %}" />
  </head>
  <body class="backend-swagger">
    <header class="backend-docs-topbar">
      <a class="backend-docs-brand" href="{{ frontend_url }}/">DEML</a>
      <nav aria-label="API documentation">
        <a href="{{ frontend_url }}/">product</a>
        <a href="/api/v1/redoc">redoc</a>
        <a href="/api/v1/openapi.json">openapi</a>
        <a href="/api/v1/health">health</a>
        <a href="/api/v1/ready">ready</a>
      </nav>
    </header>
    <div id="swagger-ui"></div>
    <!-- nosemgrep: html.security.audit.missing-integrity.missing-integrity — Swagger UI CDN; major version pinned -->
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "{{ openapi_url|escapejs }}",
        dom_id: "#swagger-ui",
        presets: [SwaggerUIBundle.presets.apis],
        layout: "BaseLayout",
        deepLinking: true,
        displayRequestDuration: true,
        defaultModelsExpandDepth: 0,
        tryItOutEnabled: true,
        persistAuthorization: true,
        requestInterceptor: (req) => {
          req.headers["X-CSRFToken"] = "{{ csrf_token|escapejs }}";
          return req;
        },
      });
    </script>
  </body>
</html>
