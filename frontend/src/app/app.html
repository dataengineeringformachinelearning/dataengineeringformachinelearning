@if (isAuthStatusPage()) {
<router-outlet />
} @else {
<div class="app-layout">
  <!-- Navbar -->
  <app-navbar></app-navbar>

  <viking-app-layout
    [hasSidebar]="isDashboardPage()"
    [sidebarCollapsible]="true"
    [autoOpenSidebar]="true"
  >
    @if (isDashboardPage()) {
    <!-- Sidebar is app-shell only — separate chunk so marketing/login stay lean -->
    @defer (on immediate) {
    <app-sidebar vikingAppLayoutSidebar></app-sidebar>
    } @placeholder {
    <viking-page-skeleton vikingAppLayoutSidebar layout="nav" label="Loading navigation" />
    } }
    <main
      vikingAppLayoutContent
      id="main-content"
      tabindex="-1"
      [class.dashboard-content]="isDashboardPage()"
      [class.main-content]="!isDashboardPage()"
      [attr.aria-busy]="routeLoading() ? 'true' : null"
    >
      <!-- Keep the outlet mounted — previous view stays visible until the next
           route activates (optimistic nav). Pages paint from SWR when warm. -->
      <router-outlet />
    </main>
  </viking-app-layout>

  <!-- Footer -->
  <app-footer></app-footer>

  <!-- Deferred chrome — keeps the critical shell lean on first paint -->
  @defer (on idle) {
  <app-issue-reporter></app-issue-reporter>
  <app-confirm-dialog />
  <app-onboarding-wizard />
  <app-command-palette />
  }
  <viking-toaster />
  <viking-shortcut-help />
  <viking-preferences />
</div>
}
