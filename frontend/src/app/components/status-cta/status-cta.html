<div class="empty-state-premium status-cta-layout">
  <div class="status-cta-copy">
    <div class="status-badge-premium primary">
      <viking-app-icon [name]="badgeIcon()" hostClass="badge-icon" [ariaHidden]="true" />
      <span>{{ badgeText() }}</span>
    </div>

    <h3 class="empty-title">{{ title() }}</h3>
    <p class="empty-subtitle">{{ subtitle() }}</p>

    <p class="empty-footer-text">Sign in or register to get started.</p>

    <div class="cta-actions">
      @if (!authService.isAuthenticated()) {
      <viking-button variant="primary" type="button" label="Get Started" (pressed)="login()">
        Get Started
      </viking-button>
      } @if (authService.isAuthenticated()) {
      <viking-button variant="primary" href="/settings" label="Create your own">
        Create your own
      </viking-button>
      }
    </div>
  </div>
</div>
